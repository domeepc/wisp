# Builds the installers. Push a tag like v1.2.0 to publish them as a GitHub
# release; run it by hand (Actions → Release → Run workflow) to just get
# them as downloads on the run's page.
#
# Optional secrets, for signing Android builds with your own key (without
# them, each build is signed with a throwaway debug key, and updates won't
# install over an older version):
#   ANDROID_KEYSTORE_BASE64   base64 of your upload keystore (.jks)
#   ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  FLUTTER_VERSION: 3.47.5
  # The deployed server/ (a repository variable), so apps show up on the
  # web app. Empty: they don't.
  SIGNALING_URL: ${{ vars.SIGNALING_URL }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: android
            os: ubuntu-latest
          - target: linux
            os: ubuntu-latest
          - target: windows
            os: windows-latest
          - target: macos
            os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          # tool/version.sh counts the commits.
          fetch-depth: 0

      - name: Version
        shell: bash
        run: |
          version="$(./tool/version.sh)"
          [[ "$GITHUB_REF_TYPE" == tag ]] || version="$version-dev"
          # Platforms want plain numbers (1.2.0) inside the app.
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "BUILD_NAME=${version%%-*}" >> "$GITHUB_ENV"
          mkdir -p build/installers

      - if: matrix.target == 'android'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get

      - name: Android
        if: matrix.target == 'android'
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [[ -n "$KEYSTORE" ]]; then
            echo "$KEYSTORE" | base64 -d > android/app/upload-keystore.jks
            {
              echo "storeFile=upload-keystore.jks"
              echo "storePassword=$STORE_PASSWORD"
              echo "keyAlias=$KEY_ALIAS"
              echo "keyPassword=$KEY_PASSWORD"
            } > android/key.properties
          fi
          flutter build apk --release --build-name "$BUILD_NAME" --build-number "$GITHUB_RUN_NUMBER" --dart-define=SIGNALING_URL="$SIGNALING_URL"
          cp build/app/outputs/flutter-apk/app-release.apk "build/installers/wisp-$VERSION-android.apk"

      - name: Linux
        if: matrix.target == 'linux'
        run: |
          flutter build linux --release --build-name "$BUILD_NAME" --build-number "$GITHUB_RUN_NUMBER" --dart-define=SIGNALING_URL="$SIGNALING_URL"
          ./tool/package_linux.sh "$VERSION"

      - name: Windows
        if: matrix.target == 'windows'
        shell: pwsh
        run: |
          flutter build windows --release --build-name "$env:BUILD_NAME" --build-number "$env:GITHUB_RUN_NUMBER" --dart-define=SIGNALING_URL="$env:SIGNALING_URL"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Compress-Archive -Path build\windows\x64\runner\Release\* `
            -DestinationPath "build\installers\wisp-$env:VERSION-windows-x64.zip"
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup --no-progress -y }
          & $iscc "/DAppVersion=$env:VERSION" windows\installer.iss
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: macOS
        if: matrix.target == 'macos'
        run: |
          flutter build macos --release --build-name "$BUILD_NAME" --build-number "$GITHUB_RUN_NUMBER" --dart-define=SIGNALING_URL="$SIGNALING_URL"
          stage="$(mktemp -d)"
          cp -R build/macos/Build/Products/Release/wisp.app "$stage/Wisp.app"
          ln -s /Applications "$stage/Applications"
          hdiutil create -volname Wisp -srcfolder "$stage" -ov -format UDZO \
            "build/installers/wisp-$VERSION-macos.dmg"

      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.target }}
          path: build/installers/*
          if-no-files-found: error

  publish:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: installers-*
          path: installers
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" installers/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Wisp ${GITHUB_REF_NAME#v}" \
            --generate-notes
