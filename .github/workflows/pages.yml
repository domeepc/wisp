# Builds the site (site/) and the web app (served under app/) and publishes
# them to GitHub Pages on every push to main.
# One-time setup: repository Settings → Pages → Source: "GitHub Actions".
name: Web app (GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # tool/version.sh counts the commits.
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.5
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      # Pages serves the web app under /<repository name>/app/, and shows the
      # version tool/version.sh prints (1.0.<commits>).
      # SIGNALING_URL: repository Settings → Secrets and variables → Actions
      # → Variables (the deployed server/, e.g. wss://wisp-signal.you.workers.dev).
      - run: >-
          flutter build web --release --wasm
          --base-href "/${{ github.event.repository.name }}/app/"
          --build-name "$(./tool/version.sh)"
          --dart-define=SIGNALING_URL=${{ vars.SIGNALING_URL }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci && npm run build
        working-directory: site
      - run: cp -r build/web site/dist/app
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
